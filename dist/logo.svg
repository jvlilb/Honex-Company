<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b026ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#b026ff;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <!-- Hexagon background -->
  <polygon points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5" fill="#07090e" stroke="url(#grad1)" stroke-width="2.5"/>
  <!-- Inner crystal shape - main diamond -->
  <polygon points="50,20 68,42 50,78 32,42" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.9"/>
  <!-- Crystal facets left -->
  <polygon points="50,20 32,42 50,52" fill="url(#grad2)" opacity="0.5"/>
  <!-- Crystal facets right -->
  <polygon points="50,20 68,42 50,52" fill="url(#grad1)" opacity="0.35"/>
  <!-- Crystal bottom left -->
  <polygon points="32,42 50,52 50,78" fill="url(#grad1)" opacity="0.25"/>
  <!-- Crystal bottom right -->
  <polygon points="68,42 50,52 50,78" fill="url(#grad2)" opacity="0.2"/>
  <!-- Center highlight lines -->
  <line x1="50" y1="20" x2="50" y2="78" stroke="url(#grad1)" stroke-width="1" opacity="0.7"/>
  <line x1="32" y1="42" x2="68" y2="42" stroke="url(#grad1)" stroke-width="1" opacity="0.7"/>
</svg>
